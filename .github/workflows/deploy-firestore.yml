name: Publicar regras do Firebase

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite PUBLICAR para confirmar"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy-firestore:
    if: ${{ inputs.confirmacao == 'PUBLICAR' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: npm ci --no-audit --no-fund
      - run: npx firebase-tools deploy --only firestore --project central-do-casal --non-interactive