# Hospedagem alternativa sem credenciais Google Cloud no GitHub.
# Em Netlify > Add new project > Import existing project, escolha este repositório.
[build]
  publish = "web"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
