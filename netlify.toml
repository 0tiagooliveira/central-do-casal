# Central do Casal passou a usar SOMENTE Firebase Hosting.
# Mantenha o site Netlify existente acessivel ate a migracao de URL.
# Porem, NAO crie novos deploys de producao cobrando creditos.
# Este comando faz com que commits disparados pelo Git sejam IGNORADOS.
# Em Netlify, pare os builds em:
# Project configuration > Developer settings > Continuous deployment > Build settings > Stopped builds.
# Build hooks manuais ignoram o comando ignore e tambem devem ser desativados.
[build]
  publish = "web"
  command = ""
  ignore = "exit 0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
